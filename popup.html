<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }

        /* --- Header --- */
        .popup-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 14px 16px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .popup-header svg {
            flex-shrink: 0;
        }

        .popup-header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .popup-header p {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 1px;
        }

        /* --- Scrollable list --- */
        #screenshot-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 340px;
            overflow: auto;
        }

        #screenshot-list::-webkit-scrollbar {
            width: 5px;
        }
        #screenshot-list::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 999px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #9ca3af;
        }

        .empty-state svg {
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.5;
        }

        /* --- Date group --- */
        .stack-date {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stack-date .count {
            background: #e0e7ff;
            color: #4f46e5;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 999px;
        }

        .thumb-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .thumb-row img {
            width: 110px;
            height: auto;
            border: 2px solid #e5e7eb;
            cursor: pointer;
            border-radius: 8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
            background: #fff;
        }

        .thumb-row img:hover {
            border-color: #a78bfa;
            transform: scale(1.03);
        }

        .thumb-row img.selected {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25), 0 2px 8px rgba(79, 70, 229, 0.15);
        }

        /* --- Footer --- */
        .popup-footer {
            padding: 12px 16px 14px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .selection-count {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
            min-height: 16px;
        }

        .selection-count span {
            color: #4f46e5;
            font-weight: 700;
        }

        #download-docx {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            letter-spacing: 0.2px;
        }

        #download-docx:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        #download-docx:active:not(:disabled) {
            transform: translateY(0);
        }

        #download-docx:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Spinner animation for building state */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #download-docx.building {
            animation: pulse 1.2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="popup-header">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="3" stroke="#fff" stroke-width="2"/>
            <circle cx="8.5" cy="8.5" r="1.5" fill="#fff"/>
            <path d="M21 15l-5-5L5 21" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
            <h1>Revise</h1>
            <p>Screenshot captures</p>
        </div>
    </div>

    <div id="screenshot-list">
        <!-- populated by popup.js -->
    </div>

    <div class="popup-footer">
        <div class="selection-count" id="selection-count"></div>
        <button id="download-docx">Export as Document</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
